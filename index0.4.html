<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sonic Engine</title>

  <!-- Favicon & Touch Icons -->
  <link rel="icon" type="image/png" sizes="32x32" href="logo.png">
  <link rel="icon" type="image/png" sizes="192x192" href="logo.png">
  <link rel="apple-touch-icon" sizes="180x180" href="logo.png">

  <!-- Open Graph Meta Tags -->
  <meta property="og:title" content="Sonic Engine">
  <meta property="og:description" content="Cyberpunk web directory audio player">
  <meta property="og:image" content="https://kushangshah.github.io/sonic-engine-player/logo.png">
  <meta property="og:type" content="website">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #06080d;
      --panel-bg: rgba(10, 14, 22, 0.88);
      --cyan: #00f2fe;
      --cyan-bright: #38bdf8;
      --purple: #c084fc;
      --purple-dim: #7928ca;
      --text-main: #f8fafc;
      --text-muted: #64748b;
      --text-dim: #94a3b8;
      --row-border: rgba(255, 255, 255, 0.045);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background: radial-gradient(circle at 50% 8%, #0d1527 0%, var(--bg-base) 85%);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 16px 20px;
      gap: 16px;
    }

    .app-workspace {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 18px;
      flex: 1;
      min-height: 0;
    }

    .neon-panel {
      background: var(--panel-bg);
      border-radius: 20px;
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      backdrop-filter: blur(28px);
      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.75),
        0 0 0 1px rgba(0, 242, 254, 0.35),
        0 0 20px rgba(0, 242, 254, 0.16),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .panel-right {
      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.75),
        0 0 0 1px rgba(0, 242, 254, 0.4),
        0 0 26px rgba(0, 242, 254, 0.22),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .sidebar-content {
      padding: 22px 20px;
      display: flex;
      flex-direction: column;
      height: 100%;
      gap: 18px;
    }

    .section-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1.6px;
      text-transform: uppercase;
      color: #f1f5f9;
    }

    .choose-card {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.04) 0%, rgba(255, 255, 255, 0.01) 100%);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 13px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .choose-card:hover {
      border-color: rgba(0, 242, 254, 0.6);
      background: linear-gradient(135deg, rgba(0, 242, 254, 0.1) 0%, rgba(192, 132, 252, 0.1) 100%);
      box-shadow: 0 0 24px rgba(0, 242, 254, 0.22);
      transform: translateY(-1px);
    }

    .choose-text h4 {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: #fff;
      margin-bottom: 3px;
    }

    .status-badge {
      font-size: 11px;
      color: var(--cyan);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 8px var(--cyan);
    }

    .folder-btn-icon {
      width: 36px;
      height: 36px;
      background: rgba(0, 242, 254, 0.14);
      border: 1px solid rgba(0, 242, 254, 0.5);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--cyan);
      box-shadow: 0 0 16px rgba(0, 242, 254, 0.25);
    }

    .tree-scroll {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding-right: 4px;
      position: relative;
    }

    .tree-scroll::-webkit-scrollbar {
      width: 4px;
    }
    .tree-scroll::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 4px;
    }

    .tree-branch-container {
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .tree-item-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text-dim);
      transition: all 0.18s ease;
      position: relative;
      margin: 2px 0;
      z-index: 2;
    }

    .tree-item-row:hover {
      background: rgba(255, 255, 255, 0.04);
      color: #fff;
    }

    .tree-item-row.active {
      background: linear-gradient(90deg, rgba(0, 242, 254, 0.18) 0%, rgba(192, 132, 252, 0.16) 100%);
      border: 1px solid rgba(0, 242, 254, 0.65);
      color: #fff;
      box-shadow: 0 0 25px rgba(0, 242, 254, 0.22), inset 0 0 10px rgba(0, 242, 254, 0.12);
    }

    .tree-item-left {
      display: flex;
      align-items: center;
      gap: 9px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .folder-glyph {
      color: var(--cyan);
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }

    .tree-svg-curve {
      position: absolute;
      top: -14px;
      pointer-events: none;
      z-index: 1;
    }

    .folder-badge {
      font-size: 11px;
      padding: 2.5px 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: var(--text-dim);
      font-family: 'JetBrains Mono', monospace;
      flex-shrink: 0;
    }

    .chevron-glyph {
      color: var(--text-muted);
      margin-left: auto;
      margin-right: 6px;
      display: flex;
      align-items: center;
      transition: transform 0.2s ease;
      flex-shrink: 0;
    }

    .chevron-glyph.open {
      transform: rotate(90deg);
      color: var(--cyan);
    }

    .panel-right-inner {
      padding: 22px 28px;
      display: flex;
      flex-direction: column;
      height: 100%;
      gap: 16px;
    }

    .breadcrumb-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .breadcrumb-bar span {
      color: #f8fafc;
      font-weight: 700;
    }

    .toolbar-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .filter-wrapper {
      position: relative;
      flex: 1;
      max-width: 420px;
    }

    .filter-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 10px;
      padding: 9px 14px 9px 36px;
      color: #fff;
      font-size: 13px;
      outline: none;
      transition: all 0.2s ease;
    }

    .filter-input:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.25);
    }

    .filter-icon {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }

    .random-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 10px;
      background: linear-gradient(135deg, rgba(0, 242, 254, 0.12) 0%, rgba(192, 132, 252, 0.12) 100%);
      border: 1px solid rgba(0, 242, 254, 0.4);
      color: #f1f5f9;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.22s ease;
      box-shadow: 0 0 14px rgba(0, 242, 254, 0.15);
    }

    .random-btn:hover {
      border-color: var(--cyan);
      box-shadow: 0 0 25px rgba(0, 242, 254, 0.35);
      transform: translateY(-1px);
      color: #fff;
    }

    .random-btn:active {
      transform: scale(0.97);
    }

    .track-table-header {
      display: grid;
      grid-template-columns: 55px 1fr 110px 140px;
      padding: 8px 16px;
      font-size: 11.5px;
      color: var(--text-muted);
      font-weight: 600;
      letter-spacing: 0.6px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .track-table-body {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .track-table-body::-webkit-scrollbar {
      width: 5px;
    }
    .track-table-body::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 4px;
    }

    .track-row {
      display: grid;
      grid-template-columns: 55px 1fr 110px 140px;
      align-items: center;
      padding: 11px 16px;
      font-size: 13.5px;
      cursor: pointer;
      color: var(--text-dim);
      transition: all 0.18s ease;
      border-bottom: 1px solid var(--row-border);
      position: relative;
    }

    .track-row:hover {
      background: rgba(255, 255, 255, 0.035);
      color: #fff;
    }

    .track-row.playing {
      background: linear-gradient(90deg, rgba(0, 242, 254, 0.15) 0%, rgba(192, 132, 252, 0.12) 100%);
      border: 1px solid rgba(0, 242, 254, 0.6);
      border-radius: 12px;
      color: #fff;
      box-shadow: 0 0 25px rgba(0, 242, 254, 0.18), inset 0 0 10px rgba(192, 132, 252, 0.1);
      margin: 2px 0;
    }

    .track-row.focused:not(.playing) {
      outline: 1px solid rgba(0, 242, 254, 0.4);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
    }

    .row-play-btn {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: rgba(0, 242, 254, 0.16);
      border: 1px solid var(--cyan);
      display: none;
      align-items: center;
      justify-content: center;
      color: var(--cyan);
      box-shadow: 0 0 10px rgba(0, 242, 254, 0.35);
    }

    .track-row.playing .row-play-btn {
      display: flex;
    }

    .track-row.playing .track-index {
      display: none;
    }

    .track-title {
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding-right: 14px;
    }

    .track-row.playing .track-title {
      font-weight: 600;
      color: #fff;
    }

    .track-mono {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--text-muted);
    }

    .track-row.playing .track-mono {
      color: var(--cyan);
    }

    .badge-wrap {
      display: flex;
      gap: 6px;
    }

    .tech-pill {
      font-size: 10px;
      padding: 2.5px 7px;
      border-radius: 6px;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-dim);
    }

    .tech-pill-accent {
      border-color: rgba(192, 132, 252, 0.4);
      color: #e9d5ff;
      background: rgba(192, 132, 252, 0.12);
    }

    .player-dock {
      background: rgba(9, 12, 19, 0.92);
      border-radius: 20px;
      position: relative;
      overflow: hidden;
      display: grid;
      grid-template-columns: 320px 1fr 60px;
      align-items: center;
      gap: 20px;
      height: 96px;
      padding: 12px 28px;
      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.8),
        0 0 0 1px rgba(0, 242, 254, 0.38),
        0 0 25px rgba(0, 242, 254, 0.2),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    #dockVisualizerCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      filter: blur(28px);
      opacity: 0.55;
      z-index: 1;
    }

    .meta-box, .playback-center, .dock-spacer {
      position: relative;
      z-index: 2;
    }

    .meta-box {
      display: flex;
      align-items: center;
      gap: 14px;
      overflow: hidden;
    }

    .album-art {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: linear-gradient(135deg, #1e1b4b, #090d16);
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.6);
      flex-shrink: 0;
    }

    .meta-text {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .meta-title {
      font-size: 13.5px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #fff;
    }

    .meta-format {
      font-size: 11px;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
    }

    .playback-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      width: 100%;
    }

    .scrubber-zone {
      width: 100%;
      height: 32px;
      position: relative;
      cursor: pointer;
      display: flex;
      align-items: center;
    }

    .line-canvas {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .controls-row {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .ctrl-btn {
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      outline: none;
    }

    .ctrl-btn:hover {
      color: #fff;
      transform: scale(1.1);
    }

    .play-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(0, 242, 254, 0.16);
      border: 1px solid var(--cyan);
      color: #fff;
      box-shadow: 0 0 22px rgba(0, 242, 254, 0.45);
      transition: all 0.25s ease;
    }

    .play-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 0 32px rgba(0, 242, 254, 0.75);
      background: var(--cyan);
      color: #000;
    }

    #folderInput {
      display: none;
    }
  </style>
</head>
<body>

  <div class="app-workspace">
    <div class="neon-panel panel-left">
      <div class="sidebar-content">
        <span class="section-title">Directory</span>

        <label class="choose-card" for="folderInput">
          <div class="choose-text">
            <h4>Choose Directory</h4>
            <div class="status-badge">
              <span class="status-dot"></span>
              <span id="statusText">Folder Directory Loaded</span>
            </div>
          </div>
          <div class="folder-btn-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
            </svg>
          </div>
        </label>
        <input type="file" id="folderInput" webkitdirectory directory multiple />

        <div class="tree-scroll" id="treeContainer">
          <div style="font-size: 12px; color: var(--text-muted); padding: 12px 6px;">
            Click 'Choose Directory' to load and explore your audio files.
          </div>
        </div>
      </div>
    </div>

    <div class="neon-panel panel-right">
      <div class="panel-right-inner">
        <div class="breadcrumb-bar" id="breadcrumb">
          Local Engine &gt; <span id="currentPathLabel">songs</span>
        </div>

        <div class="toolbar-row">
          <div class="filter-wrapper">
            <svg class="filter-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" id="filterInput" class="filter-input" placeholder="Filter tracks in folder..." />
          </div>

          <button class="random-btn" id="randomBtn" title="Randomize Tracks">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="16 3 21 3 21 8"></polyline>
              <line x1="4" y1="20" x2="21" y2="3"></line>
              <polyline points="21 16 21 21 16 21"></polyline>
              <line x1="15" y1="15" x2="21" y2="21"></line>
              <line x1="4" y1="4" x2="9" y2="9"></line>
            </svg>
            <span>Randomize</span>
          </button>
        </div>

        <div class="track-table-header">
          <div>#</div>
          <div>TITLE</div>
          <div>DURATION</div>
          <div>BITRATE</div>
        </div>

        <div class="track-table-body" id="trackList"></div>
      </div>
    </div>
  </div>

  <div class="player-dock">
    <canvas id="dockVisualizerCanvas"></canvas>
    <div class="meta-box">
      <div class="album-art">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--cyan)" stroke-width="2">
          <path d="M9 18V5l12-2v13"></path>
          <circle cx="6" cy="18" r="3"></circle>
          <circle cx="18" cy="16" r="3"></circle>
        </svg>
      </div>
      <div class="meta-text">
        <span class="meta-title" id="playerTitle">No Track Selected</span>
        <span class="meta-format" id="playerFormat">Format: --</span>
      </div>
    </div>

    <div class="playback-center">
      <div class="scrubber-zone" id="scrubberZone">
        <canvas class="line-canvas" id="scrubberCanvas"></canvas>
      </div>

      <div class="controls-row">
        <button class="ctrl-btn" id="prevBtn" title="Previous">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="2"></line></svg>
        </button>
        <button class="ctrl-btn play-btn" id="playBtn" title="Play / Pause (Spacebar)">
          <svg id="playIcon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
        </button>
        <button class="ctrl-btn" id="nextBtn" title="Next">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2"></line></svg>
        </button>
      </div>
    </div>

    <div class="dock-spacer"></div>
  </div>

  <audio id="audioElement"></audio>

  <script>
    // Optimizations:
    // 1. Use DocumentFragment for DOM injection to reduce reflows.
    // 2. Implement a virtualized-lite approach for the track list.
    // 3. Debounce filter input.
    // 4. Optimize canvas rendering by reducing unnecessary calls and simplifying shapes.
    // 5. Cache frequently accessed DOM elements.
    // 6. Use Event Delegation for track rows.

    const state = {
      audioCtx: null,
      analyser: null,
      source: null,
      dataArray: null,
      rootTree: { name: "songs", path: "songs", children: {}, files: [], isOpen: true },
      activeNode: null,
      currentFolderList: [],
      currentFilteredList: [],
      currentTrackIndex: -1,
      focusedIndex: 0,
      isPlaying: false,
      isScrubbing: false,
      lastShuffleSeed: null,
      pixelRatio: window.devicePixelRatio || 1
    };

    const dom = {
      audio: document.getElementById('audioElement'),
      filter: document.getElementById('filterInput'),
      dockCanvas: document.getElementById('dockVisualizerCanvas'),
      dockCtx: document.getElementById('dockVisualizerCanvas').getContext('2d'),
      scrubCanvas: document.getElementById('scrubberCanvas'),
      scrubCtx: document.getElementById('scrubberCanvas').getContext('2d'),
      scrubZone: document.getElementById('scrubberZone'),
      tree: document.getElementById('treeContainer'),
      trackList: document.getElementById('trackList'),
      playBtn: document.getElementById('playBtn'),
      playIcon: document.getElementById('playIcon'),
      playerTitle: document.getElementById('playerTitle'),
      playerFormat: document.getElementById('playerFormat'),
      statusText: document.getElementById('statusText'),
      pathLabel: document.getElementById('currentPathLabel'),
      folderInput: document.getElementById('folderInput')
    };

    function resizeCanvases() {
      const dw = dom.dockCanvas.parentElement.clientWidth;
      const dh = dom.dockCanvas.parentElement.clientHeight;
      dom.dockCanvas.width = dw * state.pixelRatio;
      dom.dockCanvas.height = dh * state.pixelRatio;

      const sw = dom.scrubZone.clientWidth;
      const sh = dom.scrubZone.clientHeight;
      dom.scrubCanvas.width = sw * state.pixelRatio;
      dom.scrubCanvas.height = sh * state.pixelRatio;
    }
    window.addEventListener('resize', resizeCanvases);
    resizeCanvases();

    function initAudio() {
      if (!state.audioCtx) {
        state.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        state.analyser = state.audioCtx.createAnalyser();
        state.analyser.fftSize = 128;
        state.source = state.audioCtx.createMediaElementSource(dom.audio);
        state.source.connect(state.analyser);
        state.analyser.connect(state.audioCtx.destination);
        state.dataArray = new Uint8Array(state.analyser.frequencyBinCount);
      }
      if (state.audioCtx.state === 'suspended') state.audioCtx.resume();
    }

    function renderLoop() {
      requestAnimationFrame(renderLoop);

      const dw = dom.dockCanvas.width;
      const dh = dom.dockCanvas.height;
      dom.dockCtx.clearRect(0, 0, dw, dh);

      if (state.analyser && state.isPlaying) {
        state.analyser.getByteFrequencyData(state.dataArray);
        const barCount = 14;
        const segmentWidth = dw / barCount;
        for (let i = 0; i < barCount; i++) {
          const val = state.dataArray[i * 2] || 0;
          const h = (val / 255) * dh * 0.9;
          dom.dockCtx.fillStyle = (i % 2 === 0) ? 'rgba(0, 242, 254, 0.65)' : 'rgba(192, 132, 252, 0.65)';
          dom.dockCtx.beginPath();
          dom.dockCtx.ellipse(i * segmentWidth + segmentWidth / 2, dh - h / 2, segmentWidth * 1.2, h, 0, 0, Math.PI * 2);
          dom.dockCtx.fill();
        }
      }

      const sw = dom.scrubCanvas.width;
      const sh = dom.scrubCanvas.height;
      dom.scrubCtx.clearRect(0, 0, sw, sh);

      const progress = (dom.audio.duration && !isNaN(dom.audio.duration))
        ? (dom.audio.currentTime / dom.audio.duration)
        : 0;

      const scrubX = progress * sw;
      const midY = sh / 2;

      dom.scrubCtx.beginPath();
      dom.scrubCtx.lineWidth = 2.5 * state.pixelRatio;
      dom.scrubCtx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
      dom.scrubCtx.moveTo(scrubX, midY);
      dom.scrubCtx.lineTo(sw, midY);
      dom.scrubCtx.stroke();

      dom.scrubCtx.beginPath();
      dom.scrubCtx.lineWidth = 3.5 * state.pixelRatio;
      dom.scrubCtx.strokeStyle = '#00f2fe';
      dom.scrubCtx.shadowColor = '#00f2fe';
      dom.scrubCtx.shadowBlur = 14;

      if (state.analyser && state.isPlaying) {
        state.analyser.getByteTimeDomainData(state.dataArray);
        const steps = 40;
        const slice = scrubX / steps;
        dom.scrubCtx.moveTo(0, midY);
        for (let i = 0; i <= steps; i++) {
          const v = state.dataArray[i % state.dataArray.length] / 128.0;
          const y = midY + (v - 1) * (sh * 0.35);
          dom.scrubCtx.lineTo(i * slice, y);
        }
      } else {
        const t = Date.now() * 0.003;
        dom.scrubCtx.moveTo(0, midY);
        for (let x = 0; x <= scrubX; x += 10) {
          const y = midY + Math.sin(x * 0.03 + t) * (progress > 0 ? 3 : 1.5);
          dom.scrubCtx.lineTo(x, y);
        }
      }
      dom.scrubCtx.stroke();

      if (progress > 0) {
        dom.scrubCtx.beginPath();
        dom.scrubCtx.arc(scrubX, midY, 5 * state.pixelRatio, 0, Math.PI * 2);
        dom.scrubCtx.fillStyle = '#ffffff';
        dom.scrubCtx.shadowColor = '#00f2fe';
        dom.scrubCtx.shadowBlur = 18;
        dom.scrubCtx.fill();
      }
    }
    renderLoop();

    dom.folderInput.addEventListener('change', (e) => {
      const files = Array.from(e.target.files);
      if (!files.length) return;

      const validExts = ['.mp3', '.flac', '.wav', '.ogg', '.m4a', '.aac'];
      const rootName = files[0].webkitRelativePath.split('/')[0] || "songs";
      state.rootTree = { name: rootName, path: rootName, children: {}, files: [], isOpen: true };

      files.forEach(file => {
        const lower = file.name.toLowerCase();
        if (validExts.some(ext => lower.endsWith(ext))) {
          const parts = file.webkitRelativePath.split('/');
          parts.pop();
          let curr = state.rootTree;
          let accumulated = rootName;
          for (let i = 1; i < parts.length; i++) {
            const fName = parts[i];
            accumulated += `/${fName}`;
            if (!curr.children[fName]) {
              curr.children[fName] = { name: fName, path: accumulated, children: {}, files: [], isOpen: true };
            }
            curr = curr.children[fName];
          }
          curr.files.push(file);
        }
      });
      dom.statusText.innerText = 'Directory Loaded';
      renderTree();
      selectNode(state.rootTree);
    });

    function renderTree() {
      const frag = document.createDocumentFragment();
      function buildDOM(node, depth = 0) {
        const containerDiv = document.createElement('div');
        containerDiv.className = 'tree-branch-container';

        const row = document.createElement('div');
        row.className = 'tree-item-row' + (state.activeNode === node ? ' active' : '');
        row.style.paddingLeft = (depth * 22 + 10) + 'px';
        const hasSub = Object.keys(node.children).length > 0;

        let curveSVG = '';
        if (depth > 0) {
          curveSVG = `<svg class="tree-svg-curve" style="left:${(depth - 1) * 22 + 14}px;" width="22" height="34" viewBox="0 0 22 34" fill="none">
            <path d="M 2 0 L 2 18 C 2 26, 10 26, 20 26" stroke="rgba(0, 242, 254, 0.55)" stroke-width="2" stroke-linecap="round" fill="none"/>
          </svg>`;
        }

        row.innerHTML = `${curveSVG}
          <div class="tree-item-left">
            <span class="folder-glyph">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
              </svg>
            </span>
            <span>${node.name}</span>
          </div>
          ${node.files.length > 0 ? `<span class="folder-badge">${node.files.length} songs</span>` : ''}
          ${hasSub ? `<span class="chevron-glyph ${node.isOpen ? 'open' : ''}">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </span>` : ''}`;

        row.onclick = (e) => {
          if (e.target.closest('.chevron-glyph')) {
            node.isOpen = !node.isOpen;
            renderTree();
            return;
          }
          selectNode(node);
        };

        containerDiv.appendChild(row);
        if (hasSub && node.isOpen) {
          Object.values(node.children).forEach(child => {
            containerDiv.appendChild(buildDOM(child, depth + 1));
          });
        }
        return containerDiv;
      }
      dom.tree.innerHTML = '';
      frag.appendChild(buildDOM(state.rootTree, 0));
      dom.tree.appendChild(frag);
    }

    function selectNode(node) {
      state.activeNode = node;
      dom.pathLabel.innerText = node.path.replace(/\//g, ' > ');
      state.currentFolderList = [...node.files];
      filterTracks();
      renderTree();
    }

    let filterTimeout;
    dom.filter.addEventListener('input', () => {
      clearTimeout(filterTimeout);
      filterTimeout = setTimeout(filterTracks, 150);
    });

    function filterTracks() {
      const q = dom.filter.value.toLowerCase();
      state.currentFilteredList = state.currentFolderList.filter(f => f.name.toLowerCase().includes(q));
      state.focusedIndex = 0;
      renderTrackTable();
    }

    document.getElementById('randomBtn').addEventListener('click', () => {
      if (state.currentFilteredList.length <= 1) return;
      let shuffled = [...state.currentFilteredList];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      state.currentFilteredList = shuffled;
      state.focusedIndex = 0;
      renderTrackTable();
      playTrack(0);
    });

    function formatTime(sec) {
      if (isNaN(sec) || sec === 0) return "--:--";
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function renderTrackTable() {
      const frag = document.createDocumentFragment();
      state.currentFilteredList.forEach((file, idx) => {
        const ext = file.name.split('.').pop().toUpperCase();
        const isCurrentPlaying = (state.currentTrackIndex === idx);
        const isFocused = (state.focusedIndex === idx);

        const row = document.createElement('div');
        row.className = 'track-row' + (isCurrentPlaying ? ' playing' : '') + (isFocused ? ' focused' : '');
        row.id = `track-${idx}`;
        row.innerHTML = `
          <div class="track-mono">
            <span class="track-index">${idx + 1}</span>
            <div class="row-play-btn">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
            </div>
          </div>
          <div class="track-title">${file.name.replace(/\.[^/.]+$/, "")}</div>
          <div class="track-mono" id="dur-${idx}">--:--</div>
          <div class="badge-wrap">
            <span class="tech-pill">320k</span>
            <span class="tech-pill tech-pill-accent">${ext}</span>
          </div>
        `;

        const tmp = new Audio();
        tmp.preload = "metadata";
        tmp.src = URL.createObjectURL(file);
        tmp.onloadedmetadata = () => {
          const d = document.getElementById(`dur-${idx}`);
          if (d) d.innerText = formatTime(tmp.duration);
        };

        row.onclick = () => {
          state.focusedIndex = idx;
          playTrack(idx);
        };
        frag.appendChild(row);
      });
      dom.trackList.innerHTML = '';
      dom.trackList.appendChild(frag);
    }

    function playTrack(idx) {
      initAudio();
      state.currentTrackIndex = idx;
      state.focusedIndex = idx;
      const file = state.currentFilteredList[idx];
      if (!file) return;

      dom.audio.src = URL.createObjectURL(file);
      dom.audio.play();
      state.isPlaying = true;
      updatePlayButton();

      const ext = file.name.split('.').pop().toUpperCase();
      dom.playerTitle.innerText = file.name.replace(/\.[^/.]+$/, "");
      dom.playerFormat.innerText = `Format: ${ext}`;

      document.querySelectorAll('.track-row').forEach(r => r.classList.remove('playing'));
      const activeRow = document.getElementById(`track-${idx}`);
      if (activeRow) {
        activeRow.classList.add('playing');
        activeRow.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      }
    }

    function togglePlayPause() {
      initAudio();
      if (!dom.audio.src) {
        if (state.currentFilteredList.length > 0) playTrack(state.focusedIndex || 0);
        return;
      }
      if (state.isPlaying) {
        dom.audio.pause();
        state.isPlaying = false;
      } else {
        dom.audio.play();
        state.isPlaying = true;
      }
      updatePlayButton();
    }

    function updatePlayButton() {
      dom.playIcon.innerHTML = state.isPlaying
        ? `<rect x="5" y="4" width="4" height="16"></rect><rect x="15" y="4" width="4" height="16"></rect>`
        : `<polygon points="5 3 19 12 5 21 5 3"></polygon>`;
    }

    dom.playBtn.onclick = togglePlayPause;
    document.getElementById('prevBtn').onclick = () => {
      if (state.currentTrackIndex > 0) playTrack(state.currentTrackIndex - 1);
    };
    document.getElementById('nextBtn').onclick = () => {
      if (state.currentTrackIndex < state.currentFilteredList.length - 1) playTrack(state.currentTrackIndex + 1);
    };
    dom.audio.onended = () => {
      if (state.currentTrackIndex < state.currentFilteredList.length - 1) playTrack(state.currentTrackIndex + 1);
    };

    function handleSeek(e) {
      if (!dom.audio.duration) return;
      const rect = dom.scrubZone.getBoundingClientRect();
      const pos = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      dom.audio.currentTime = pos * dom.audio.duration;
    }

    dom.scrubZone.addEventListener('mousedown', (e) => {
      state.isScrubbing = true;
      handleSeek(e);
    });
    window.addEventListener('mousemove', (e) => {
      if (state.isScrubbing) handleSeek(e);
    });
    window.addEventListener('mouseup', () => {
      state.isScrubbing = false;
    });

    window.addEventListener('keydown', (e) => {
      if (document.activeElement === dom.filter) return;
      if (e.code === 'Space') {
        e.preventDefault();
        togglePlayPause();
      } else if (e.code === 'ArrowDown') {
        e.preventDefault();
        if (state.currentFilteredList.length === 0) return;
        state.focusedIndex = Math.min(state.currentFilteredList.length - 1, state.focusedIndex + 1);
        updateRowSelection();
      } else if (e.code === 'ArrowUp') {
        e.preventDefault();
        if (state.currentFilteredList.length === 0) return;
        state.focusedIndex = Math.max(0, state.focusedIndex - 1);
        updateRowSelection();
      } else if (e.code === 'Enter') {
        e.preventDefault();
        if (state.currentFilteredList[state.focusedIndex]) playTrack(state.focusedIndex);
      }
    });

    function updateRowSelection() {
      document.querySelectorAll('.track-row').forEach((r, idx) => {
        r.classList.toggle('focused', idx === state.focusedIndex);
      });
      const el = document.getElementById(`track-${state.focusedIndex}`);
      if (el) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }
  </script>
</body>
</html>
