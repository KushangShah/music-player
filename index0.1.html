<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sonic Engine - Dark Tech Player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #06080d;
      --card-bg: rgba(13, 17, 26, 0.75);
      --card-border: rgba(0, 242, 254, 0.16);
      --card-border-alt: rgba(168, 85, 247, 0.2);
      --cyan: #00f2fe;
      --cyan-glow: rgba(0, 242, 254, 0.4);
      --purple: #a855f7;
      --purple-glow: rgba(168, 85, 247, 0.4);
      --text-main: #f1f5f9;
      --text-muted: #5e6c84;
      --text-dim: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background: radial-gradient(circle at 50% 15%, #0f1626 0%, var(--bg-base) 80%);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 18px 22px 18px;
      gap: 16px;
    }

    /* Layout */
    .app-workspace {
      display: grid;
      grid-template-columns: 370px 1fr;
      gap: 18px;
      flex: 1;
      min-height: 0;
    }

    .panel {
      background: var(--card-bg);
      border-radius: 20px;
      border: 1px solid var(--card-border);
      backdrop-filter: blur(30px);
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel-right {
      border: 1px solid rgba(0, 242, 254, 0.25);
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.65), 0 0 45px rgba(0, 242, 254, 0.03);
    }

    /* Left Sidebar */
    .panel-left-inner {
      padding: 22px 20px;
      display: flex;
      flex-direction: column;
      height: 100%;
      gap: 18px;
    }

    .section-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #e2e8f0;
    }

    .choose-card {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.01) 100%);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 13px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .choose-card:hover {
      border-color: rgba(0, 242, 254, 0.5);
      box-shadow: 0 0 25px rgba(0, 242, 254, 0.18);
      background: linear-gradient(135deg, rgba(0, 242, 254, 0.1) 0%, rgba(168, 85, 247, 0.08) 100%);
      transform: translateY(-1px);
    }

    .choose-text h4 {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: #fff;
      margin-bottom: 3px;
    }

    .status-badge {
      font-size: 11px;
      color: var(--cyan);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 8px var(--cyan);
    }

    .folder-btn-icon {
      width: 36px;
      height: 36px;
      background: rgba(0, 242, 254, 0.12);
      border: 1px solid rgba(0, 242, 254, 0.4);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--cyan);
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.15);
    }

    /* Nested Tree Explorer */
    .tree-scroll {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding-right: 4px;
      position: relative;
    }

    .tree-scroll::-webkit-scrollbar {
      width: 4px;
    }
    .tree-scroll::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
    }

    .tree-branch {
      position: relative;
    }

    .tree-branch.has-indent {
      margin-left: 20px;
      border-left: 1.5px solid rgba(0, 242, 254, 0.25);
    }

    .tree-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 10px 7px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-dim);
      transition: all 0.2s ease;
      margin: 2px 0;
      position: relative;
    }

    .tree-branch.has-indent > .tree-row::before {
      content: '';
      position: absolute;
      left: -20px;
      top: 50%;
      width: 16px;
      height: 1.5px;
      background: rgba(0, 242, 254, 0.25);
    }

    .tree-row:hover {
      background: rgba(255, 255, 255, 0.04);
      color: #fff;
    }

    .tree-row.active {
      background: linear-gradient(90deg, rgba(0, 242, 254, 0.16) 0%, rgba(168, 85, 247, 0.12) 100%);
      border: 1px solid rgba(0, 242, 254, 0.5);
      color: #fff;
      box-shadow: 0 0 20px rgba(0, 242, 254, 0.15), inset 0 0 10px rgba(0, 242, 254, 0.1);
    }

    .tree-row-left {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .folder-icon {
      color: var(--cyan);
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }

    .chevron-icon {
      color: var(--text-muted);
      margin-left: auto;
      margin-right: 4px;
      display: flex;
      align-items: center;
      transition: transform 0.2s ease;
      flex-shrink: 0;
    }

    .chevron-icon.open {
      transform: rotate(90deg);
      color: var(--cyan);
    }

    .folder-badge {
      font-size: 11px;
      padding: 2px 7px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      color: var(--text-dim);
      font-family: 'JetBrains Mono', monospace;
      flex-shrink: 0;
    }

    /* Right Tracklist Panel */
    .panel-right-inner {
      padding: 24px 28px;
      display: flex;
      flex-direction: column;
      height: 100%;
      gap: 16px;
    }

    .breadcrumb-bar {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .breadcrumb-bar span {
      color: #f8fafc;
      font-weight: 700;
    }

    .filter-wrapper {
      position: relative;
      width: 100%;
      max-width: 380px;
    }

    .filter-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 9px 14px 9px 36px;
      color: #fff;
      font-size: 13px;
      outline: none;
      transition: all 0.2s ease;
    }

    .filter-input:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.2);
    }

    .filter-icon {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }

    /* Track Table */
    .track-table-header {
      display: grid;
      grid-template-columns: 55px 1fr 110px 140px;
      padding: 8px 16px;
      font-size: 11.5px;
      color: var(--text-muted);
      font-weight: 600;
      letter-spacing: 0.6px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .track-table-body {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding-top: 6px;
    }

    .track-table-body::-webkit-scrollbar {
      width: 5px;
    }
    .track-table-body::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 4px;
    }

    .track-row {
      display: grid;
      grid-template-columns: 55px 1fr 110px 140px;
      align-items: center;
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 13.5px;
      cursor: pointer;
      color: var(--text-dim);
      transition: all 0.18s ease;
      position: relative;
    }

    .track-row:hover {
      background: rgba(255, 255, 255, 0.04);
      color: #fff;
      transform: translateX(3px);
    }

    .track-row.playing {
      background: linear-gradient(90deg, rgba(0, 242, 254, 0.12) 0%, rgba(168, 85, 247, 0.08) 100%);
      border: 1px solid rgba(0, 242, 254, 0.5);
      color: #fff;
      box-shadow: 0 0 25px rgba(0, 242, 254, 0.15), inset 0 0 10px rgba(168, 85, 247, 0.1);
    }

    .row-play-btn {
      width: 26px;
      height: 26px;
      border-radius: 7px;
      background: rgba(0, 242, 254, 0.15);
      border: 1px solid var(--cyan);
      display: none;
      align-items: center;
      justify-content: center;
      color: var(--cyan);
    }

    .track-row.playing .row-play-btn {
      display: flex;
    }

    .track-row.playing .track-index {
      display: none;
    }

    .track-title {
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding-right: 14px;
    }

    .track-row.playing .track-title {
      font-weight: 600;
      color: #fff;
    }

    .track-mono {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--text-muted);
    }

    .track-row.playing .track-mono {
      color: var(--cyan);
    }

    .badge-wrap {
      display: flex;
      gap: 6px;
    }

    .tech-pill {
      font-size: 10px;
      padding: 2.5px 7px;
      border-radius: 6px;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-dim);
    }

    .tech-pill-accent {
      border-color: rgba(168, 85, 247, 0.4);
      color: #d8b4fe;
      background: rgba(168, 85, 247, 0.12);
    }

    /* Bottom Player Dock */
    .player-dock {
      background: rgba(10, 13, 20, 0.95);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(24px);
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.7);
      padding: 14px 28px;
      display: grid;
      grid-template-columns: 320px 1fr 100px;
      align-items: center;
      gap: 20px;
      height: 98px;
    }

    /* Track Metadata */
    .meta-box {
      display: flex;
      align-items: center;
      gap: 14px;
      overflow: hidden;
    }

    .album-art {
      width: 50px;
      height: 50px;
      border-radius: 12px;
      background: linear-gradient(135deg, #1e1b4b, #090d16);
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.6);
      flex-shrink: 0;
    }

    .meta-text {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .meta-title {
      font-size: 13.5px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #fff;
    }

    .meta-format {
      font-size: 11px;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
    }

    /* Center: Waveform & Scrubber */
    .playback-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      width: 100%;
    }

    .waveform-scrubber-wrapper {
      width: 100%;
      height: 32px;
      position: relative;
      cursor: pointer;
      display: flex;
      align-items: center;
    }

    .waveform-canvas {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* Scrubber Track Line */
    .scrubber-track {
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 100%;
      height: 3px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
    }

    .scrubber-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--cyan), var(--purple));
      border-radius: 3px;
      position: relative;
      box-shadow: 0 0 10px var(--cyan);
    }

    .scrubber-thumb {
      position: absolute;
      right: -5px;
      top: -3.5px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 12px var(--cyan);
    }

    .controls-row {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .ctrl-btn {
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      outline: none;
    }

    .ctrl-btn:hover {
      color: #fff;
      transform: scale(1.1);
    }

    .play-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(0, 242, 254, 0.15);
      border: 1px solid var(--cyan);
      color: #fff;
      box-shadow: 0 0 20px rgba(0, 242, 254, 0.35);
      transition: all 0.25s ease;
    }

    .play-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 0 30px rgba(0, 242, 254, 0.65);
      background: var(--cyan);
      color: #000;
    }

    #folderInput {
      display: none;
    }
  </style>
</head>
<body>

  <!-- Top Workspace -->
  <div class="app-workspace">

    <!-- Left Panel: Directory Tree -->
    <div class="panel panel-left">
      <div class="panel-left-inner">
        <span class="section-title">Directory</span>

        <!-- Choose Directory Card -->
        <label class="choose-card" for="folderInput">
          <div class="choose-text">
            <h4>Choose Directory</h4>
            <div class="status-badge">
              <span class="status-dot"></span>
              <span id="statusText">Click to select folder</span>
            </div>
          </div>
          <div class="folder-btn-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
            </svg>
          </div>
        </label>
        <input type="file" id="folderInput" webkitdirectory directory multiple />

        <!-- Recursive VS-Code Style File Explorer Tree -->
        <div class="tree-scroll" id="treeContainer">
          <div style="font-size: 12px; color: var(--text-muted); padding: 12px 6px;">
            Select your root folder to view nested directories.
          </div>
        </div>
      </div>
    </div>

    <!-- Right Panel: Tracklist -->
    <div class="panel panel-right">
      <div class="panel-right-inner">
        <!-- Breadcrumb -->
        <div class="breadcrumb-bar" id="breadcrumb">
          Local Engine &gt; <span id="currentPathLabel">songs</span>
        </div>

        <div class="filter-wrapper">
          <svg class="filter-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="filterInput" class="filter-input" placeholder="Filter tracks in folder..." />
        </div>

        <!-- Table View -->
        <div class="track-table-header">
          <div>#</div>
          <div>TITLE</div>
          <div>DURATION</div>
          <div>BITRATE</div>
        </div>

        <div class="track-table-body" id="trackList">
          <!-- Populated dynamically -->
        </div>
      </div>
    </div>

  </div>

  <!-- Bottom Persistent Player Bar -->
  <div class="player-dock">
    <!-- Left: Meta -->
    <div class="meta-box">
      <div class="album-art">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--cyan)" stroke-width="2">
          <path d="M9 18V5l12-2v13"></path>
          <circle cx="6" cy="18" r="3"></circle>
          <circle cx="18" cy="16" r="3"></circle>
        </svg>
      </div>
      <div class="meta-text">
        <span class="meta-title" id="playerTitle">No Track Selected</span>
        <span class="meta-format" id="playerFormat">Format: --</span>
      </div>
    </div>

    <!-- Center: Interactive Waveform Scrubber & Controls -->
    <div class="playback-center">
      <!-- Click / Drag Anywhere on this container to Fast-Forward & Rewind -->
      <div class="waveform-scrubber-wrapper" id="scrubberWrapper">
        <div class="scrubber-track">
          <div class="scrubber-fill" id="scrubberFill">
            <div class="scrubber-thumb"></div>
          </div>
        </div>
        <canvas class="waveform-canvas" id="waveformCanvas"></canvas>
      </div>

      <div class="controls-row">
        <button class="ctrl-btn" id="prevBtn" title="Previous">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="2"></line></svg>
        </button>
        <button class="ctrl-btn play-btn" id="playBtn" title="Play / Pause">
          <svg id="playIcon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
        </button>
        <button class="ctrl-btn" id="nextBtn" title="Next">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2"></line></svg>
        </button>
      </div>
    </div>

    <!-- Right Spacer -->
    <div></div>
  </div>

  <audio id="audioElement"></audio>

  <script>
    // Audio Context & State
    let audioCtx, analyser, source, dataArray;
    let rootTree = { name: "songs", path: "songs", children: {}, files: [], totalFiles: 0 };
    let activeNode = null;
    let currentFolderList = [];
    let currentFilteredList = [];
    let currentTrackIndex = -1;
    let isPlaying = false;
    let isScrubbing = false;

    const audioElement = document.getElementById('audioElement');
    const canvas = document.getElementById("waveformCanvas");
    const ctx = canvas.getContext("2d");

    function resizeCanvas() {
      canvas.width = canvas.parentElement.clientWidth * window.devicePixelRatio;
      canvas.height = canvas.parentElement.clientHeight * window.devicePixelRatio;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function initAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 128;
        source = audioCtx.createMediaElementSource(audioElement);
        source.connect(analyser);
        analyser.connect(audioCtx.destination);
        dataArray = new Uint8Array(analyser.frequencyBinCount);
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    // Glowing Neon Waveform
    function renderWaveform() {
      requestAnimationFrame(renderWaveform);
      const w = canvas.width;
      const h = canvas.height;
      ctx.clearRect(0, 0, w, h);

      ctx.beginPath();
      ctx.lineWidth = 3 * window.devicePixelRatio;
      ctx.strokeStyle = '#00f2fe';
      ctx.shadowBlur = 10;
      ctx.shadowColor = '#00f2fe';

      if (analyser && isPlaying) {
        analyser.getByteTimeDomainData(dataArray);
        let sliceWidth = w / dataArray.length;
        let x = 0;
        for (let i = 0; i < dataArray.length; i++) {
          let v = dataArray[i] / 128.0;
          let y = (v * h) / 2;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
          x += sliceWidth;
        }
      } else {
        let t = Date.now() * 0.003;
        ctx.moveTo(0, h / 2);
        for (let x = 0; x < w; x += 12) {
          let y = h / 2 + Math.sin(x * 0.02 + t) * 3;
          ctx.lineTo(x, y);
        }
      }
      ctx.stroke();
    }
    renderWaveform();

    // Directory Tree Building
    const folderInput = document.getElementById('folderInput');
    folderInput.addEventListener('change', (e) => {
      const files = Array.from(e.target.files);
      if (!files.length) return;

      const validExts = ['.mp3', '.flac', '.wav', '.ogg', '.m4a', '.aac'];
      const rootFolderName = files[0].webkitRelativePath.split('/')[0] || "songs";

      rootTree = { name: rootFolderName, path: rootFolderName, children: {}, files: [], totalFiles: 0, isOpen: true };

      files.forEach(file => {
        const lower = file.name.toLowerCase();
        if (validExts.some(ext => lower.endsWith(ext))) {
          const parts = file.webkitRelativePath.split('/');
          parts.pop(); // remove file name

          let curr = rootTree;
          curr.totalFiles++;

          let accumulatedPath = rootFolderName;
          for (let i = 1; i < parts.length; i++) {
            const folder = parts[i];
            accumulatedPath += `/${folder}`;
            if (!curr.children[folder]) {
              curr.children[folder] = { 
                name: folder, 
                path: accumulatedPath, 
                children: {}, 
                files: [], 
                totalFiles: 0, 
                isOpen: true 
              };
            }
            curr = curr.children[folder];
            curr.totalFiles++;
          }
          curr.files.push(file);
        }
      });

      document.getElementById('statusText').innerText = 'Directory Loaded';
      renderTree();
      selectNode(rootTree);
    });

    // Render Recursive Tree with Indented Visual Branch Connectors
    function renderTree() {
      const container = document.getElementById('treeContainer');
      container.innerHTML = '';

      function buildDOM(node, depth = 0) {
        const branchWrapper = document.createElement('div');
        branchWrapper.className = 'tree-branch' + (depth > 0 ? ' has-indent' : '');

        const row = document.createElement('div');
        row.className = 'tree-row' + (activeNode === node ? ' active' : '');

        const hasSubfolders = Object.keys(node.children).length > 0;

        row.innerHTML = `
          <div class="tree-row-left">
            <span class="folder-icon">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
              </svg>
            </span>
            <span>${node.name}</span>
          </div>
          ${node.files.length > 0 ? `<span class="folder-badge">${node.files.length} songs</span>` : ''}
          ${hasSubfolders ? `
            <span class="chevron-icon ${node.isOpen ? 'open' : ''}">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="9 18 15 12 9 6"></polyline>
              </svg>
            </span>` : ''}
        `;

        row.onclick = (e) => {
          if (e.target.closest('.chevron-icon')) {
            node.isOpen = !node.isOpen;
            renderTree();
            return;
          }
          selectNode(node);
        };

        branchWrapper.appendChild(row);

        if (hasSubfolders && node.isOpen) {
          const childrenContainer = document.createElement('div');
          childrenContainer.className = 'tree-children';
          Object.values(node.children).forEach(child => {
            childrenContainer.appendChild(buildDOM(child, depth + 1));
          });
          branchWrapper.appendChild(childrenContainer);
        }

        return branchWrapper;
      }

      container.appendChild(buildDOM(rootTree, 0));
    }

    // Select Folder Node
    function selectNode(node) {
      activeNode = node;
      document.getElementById('currentPathLabel').innerText = node.path.replace(/\//g, ' > ');
      currentFolderList = [...node.files];
      filterTracks();
      renderTree();
    }

    // Track Filter
    const filterInput = document.getElementById('filterInput');
    filterInput.addEventListener('input', filterTracks);

    function filterTracks() {
      const q = filterInput.value.toLowerCase();
      currentFilteredList = currentFolderList.filter(f => f.name.toLowerCase().includes(q));
      renderTrackTable();
    }

    // Format Duration Helper
    function formatTime(seconds) {
      if (isNaN(seconds) || seconds === 0) return "--:--";
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
    }

    // Render Track Table with Live Accurate Durations
    const trackList = document.getElementById('trackList');
    function renderTrackTable() {
      trackList.innerHTML = '';
      currentFilteredList.forEach((file, idx) => {
        const ext = file.name.split('.').pop().toUpperCase();
        const isCurrentPlaying = (currentTrackIndex === idx);

        const row = document.createElement('div');
        row.className = 'track-row' + (isCurrentPlaying ? ' playing' : '');
        row.id = `track-${idx}`;
        row.innerHTML = `
          <div class="track-mono">
            <span class="track-index">${idx + 1}</span>
            <div class="row-play-btn">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
            </div>
          </div>
          <div class="track-title">${file.name.replace(/\.[^/.]+$/, "")}</div>
          <div class="track-mono duration-label" id="dur-${idx}">--:--</div>
          <div class="badge-wrap">
            <span class="tech-pill">320k</span>
            <span class="tech-pill tech-pill-accent">${ext}</span>
          </div>
        `;

        // Preload metadata to display actual duration mm:ss
        const tempAudio = new Audio();
        tempAudio.preload = "metadata";
        tempAudio.src = URL.createObjectURL(file);
        tempAudio.onloadedmetadata = () => {
          const durEl = document.getElementById(`dur-${idx}`);
          if (durEl) durEl.innerText = formatTime(tempAudio.duration);
        };

        row.onclick = () => playTrack(idx);
        trackList.appendChild(row);
      });
    }

    // Audio Playback
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const playerTitle = document.getElementById('playerTitle');
    const playerFormat = document.getElementById('playerFormat');
    const scrubberFill = document.getElementById('scrubberFill');

    function playTrack(index) {
      initAudioContext();
      currentTrackIndex = index;
      const file = currentFilteredList[index];
      if (!file) return;

      audioElement.src = URL.createObjectURL(file);
      audioElement.play();
      isPlaying = true;
      updatePlayButton();

      const ext = file.name.split('.').pop().toUpperCase();
      playerTitle.innerText = file.name.replace(/\.[^/.]+$/, "");
      playerFormat.innerText = `Format: ${ext}`;

      document.querySelectorAll('.track-row').forEach(r => r.classList.remove('playing'));
      const activeRow = document.getElementById(`track-${index}`);
      if (activeRow) activeRow.classList.add('playing');
    }

    function updatePlayButton() {
      playIcon.innerHTML = isPlaying
        ? `<rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect>`
        : `<polygon points="5 3 19 12 5 21 5 3"></polygon>`;
    }

    playBtn.onclick = () => {
      initAudioContext();
      if (!audioElement.src) return;
      if (isPlaying) {
        audioElement.pause();
        isPlaying = false;
      } else {
        audioElement.play();
        isPlaying = true;
      }
      updatePlayButton();
    };

    document.getElementById('prevBtn').onclick = () => {
      if (currentTrackIndex > 0) playTrack(currentTrackIndex - 1);
    };

    document.getElementById('nextBtn').onclick = () => {
      if (currentTrackIndex < currentFilteredList.length - 1) playTrack(currentTrackIndex + 1);
    };

    audioElement.onended = () => {
      if (currentTrackIndex < currentFilteredList.length - 1) playTrack(currentTrackIndex + 1);
    };

    // Fast-Forward & Scrubbing (Click or Drag Anywhere on Waveform)
    const scrubberWrapper = document.getElementById('scrubberWrapper');

    function seek(e) {
      if (!audioElement.duration) return;
      const rect = scrubberWrapper.getBoundingClientRect();
      const pos = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      audioElement.currentTime = pos * audioElement.duration;
      scrubberFill.style.width = (pos * 100) + '%';
    }

    scrubberWrapper.addEventListener('mousedown', (e) => {
      isScrubbing = true;
      seek(e);
    });

    window.addEventListener('mousemove', (e) => {
      if (isScrubbing) seek(e);
    });

    window.addEventListener('mouseup', () => {
      isScrubbing = false;
    });

    // Update Scrubber Fill Position
    audioElement.ontimeupdate = () => {
      if (!isScrubbing && audioElement.duration) {
        const pct = (audioElement.currentTime / audioElement.duration) * 100;
        scrubberFill.style.width = pct + '%';
      }
    };
  </script>
</body>
</html>
